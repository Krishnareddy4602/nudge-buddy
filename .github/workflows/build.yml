# Builds the Mac (.dmg) and Windows (.exe) apps on GitHub's machines.
# Run it from the repo's Actions tab ("Run workflow"), then download the files from the run's Artifacts.
name: Build Nudge Buddy

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Mac app
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Windows app
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      # Older Macs: Electron 38+ needs macOS 12+, so also build one on Electron 37 (runs on macOS 11 Big Sur and up).
      - name: Build Mac app for older macOS (11 Big Sur+)
        if: runner.os == 'macOS'
        run: |
          rm -rf dist/mac-universal
          npm install --no-save electron@37
          EV=$(node -p "require('electron/package.json').version")
          echo "Using Electron $EV"
          npx electron-builder --mac --publish never -c.electronVersion=$EV -c.mac.artifactName='NudgeBuddy-${version}-mac-older-macOS-11.${ext}'
          echo "Minimum macOS of the older build:"
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "dist/mac-universal/Nudge Buddy.app/Contents/Info.plist"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: NudgeBuddy-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
